# 镜像持续验证：推送 main / 提交 PR（纯文档变更跳过）时构建 Dockerfile（不推送），
# 容器启动冒烟 /health，镜像体积写入 Summary——保证发布流水线推送到 Docker Hub 的
# 始终是可启动的瘦身镜像（debian-slim + 自包含单文件，见 Dockerfile / docs/deployment/sdd.md）。
name: docker-verify

'on':
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像（载入本地，不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: sdata:verify
          # GHA 缓存 scope 与发布流水线共用，发布 tag 构建时直接命中热缓存
          cache-from: type=gha,scope=sdata
          cache-to: type=gha,scope=sdata,mode=max
          provenance: false
          sbom: false

      - name: 容器冒烟验证（/health）并记录镜像体积
        run: |
          set -euo pipefail
          docker run -d --name sdata-smoke -p 5300:5300 sdata:verify
          HEALTH=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5300/health >/dev/null 2>&1; then HEALTH=1; break; fi
            sleep 2
          done
          docker logs sdata-smoke > sdata-smoke.log 2>&1 || true
          if [ "$HEALTH" != 1 ]; then
            echo '::error::容器 60 秒内 /health 未就绪'
            tail -60 sdata-smoke.log
            exit 1
          fi
          echo "冒烟通过：/health 200"
          docker rm -f sdata-smoke >/dev/null
          BYTES=$(docker image inspect sdata:verify --format '{{.Size}}')
          MB=$(( BYTES / 1024 / 1024 ))
          {
            echo '### SData 镜像验证通过'
            echo '- 构建自 Dockerfile（debian-slim + 自包含单文件产物）'
            echo "- 镜像体积：约 ${MB} MB"
            echo '- 冒烟：容器启动 → /health 200'
          } >> "$GITHUB_STEP_SUMMARY"
