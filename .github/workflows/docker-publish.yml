# 与 moai 共用密钥约定：docker 环境（或 Repository secrets）中的
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN；镜像仓库默认 <账号>/sdata。
name: release

'on':
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 校验版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NUMBER='(0|[1-9][0-9]*)'
          IDENTIFIER='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="^${NUMBER}\.${NUMBER}\.${NUMBER}(-${IDENTIFIER}(\.${IDENTIFIER})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          [[ "$VERSION" =~ $SEMVER && ${#VERSION} -le 128 ]] || { echo '::error::非法 SemVer tag'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  build-ui:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证打包和启动脚本
        run: python -I tool/Release/test_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建主应用与探针
        working-directory: ui
        run: |
          npm install --global pnpm@10 --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec vite build --outDir ../.artifacts/release-ui
          pnpm exec vite build --config vite.probe.config.ts --outDir ../.artifacts/release-ui/rum
      - uses: actions/upload-artifact@v4
        with:
          name: release-ui
          path: .artifacts/release-ui/
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [version, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-ui
          path: .artifacts/release-ui
      - name: 发布独立运行程序
        run: |
          # 单文件 + 原生库内嵌 + 单文件压缩：win-x64 exe 166MB → 72MB、解压目录 174MB → 80MB（压缩包仍约 69MB）。
          # 代价是运行时私有内存约 +60MB、工作集约 +100MB，冷启动首次解压多约 0.5s；取舍见 docs/deployment/sdd.md。
          # R2R 只会变大（仅 R2R 231MB、R2R+压缩 96MB），关闭；不裁剪：full/partial 裁剪后启动即崩溃（Maomi 模块反射、MCP JSON 反射）。
          dotnet publish src/SData/SData.csproj -c Release -r "$RID" --self-contained true \
            -p:UseAppHost=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=false \
            -p:PublishTrimmed=false \
            -o .artifacts/publish --nologo
      - name: 打包并检查隐私边界
        run: |
          python -I tool/Release/package.py --rid "$RID" --version "$VERSION" \
            --publish .artifacts/publish --ui .artifacts/release-ui --output .artifacts/packages
      - name: 验证最终压缩包
        run: |
          if [[ "$RID" == win-* ]]; then EXT=zip; else EXT=tar.gz; fi
          python -I tool/Release/smoke.py --archive ".artifacts/packages/sdata-$VERSION-$RID.$EXT"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: |
            .artifacts/packages/*.zip
            .artifacts/packages/*.tar.gz
            .artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: packages
      - name: 验证并汇总校验和
        working-directory: packages
        run: |
          set -euo pipefail
          [[ "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 5 ]]
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: 创建或更新 Release
        working-directory: packages
        run: |
          set -euo pipefail
          # 先以 draft 上传全部资产，只有五个平台都成功才公开。
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    environment: docker
    timeout-minutes: 60
    env:
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      IMAGE_REPO: ${{ vars.DOCKERHUB_REPO || 'sdata' }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出版本代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 校验发布凭据
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少密钥 $name，请配置 docker 环境或 Repository secrets"
              exit 1
            fi
          done

      - name: 解析镜像标签
        id: meta
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION%%+*}"
          # SemVer 已由 version job 验证，Docker 标签只移除构建元数据。
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::tag 必须为 X.Y.Z / vX.Y.Z，可带 -rc.1 或 +build.7"
            exit 1
          fi
          VERSION="${VERSION%%+*}"
          if [ "${#VERSION}" -gt 128 ]; then
            echo "::error::镜像版本标签不能超过 128 个字符"
            exit 1
          fi
          if [[ ! "$IMAGE_NAMESPACE" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]] ||
             [[ ! "$IMAGE_REPO" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*$ ]]; then
            echo "::error::Docker Hub 命名空间或仓库名不合法，请使用小写镜像名称"
            exit 1
          fi
          IMAGE="$IMAGE_NAMESPACE/$IMAGE_REPO"
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          {
            echo "version=$VERSION"
            echo "commit_sha=$COMMIT_SHA"
            echo 'tags<<EOF'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:sha-$SHORT_SHA"
            if [[ "$VERSION" != *-* ]]; then
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Dockerfile 的 DuckDB 发布 RID 固定为 linux-x64，不提供伪多架构镜像。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=SData
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=sdata
          cache-to: type=gha,scope=sdata,mode=max
          provenance: false
          sbom: false

      - name: 发布结果
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo '### SData Docker Hub 发布成功'
            echo '- 平台：`linux/amd64`'
            while IFS= read -r tag; do
              printf -- '- `%s`\n' "$tag"
            done <<< "$IMAGE_TAGS"
            printf -- '- Digest：`%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
