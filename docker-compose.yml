version: "3.8"

# SData 内网单机部署：单容器（前端内嵌 wwwroot 同源托管），SQLite + DuckDB 数据落 /app/data 卷
services:
  sdata:
    build: .
    container_name: sdata
    restart: unless-stopped
    ports:
      - "5300:5300"
    volumes:
      - ./data:/app/data           # sdata.db + sdata.duckdb + 日志
      - ./configs:/app/configs     # system.json（从 system.example.json 复制修改）
    environment:
      - SDATA_FILE=/app/configs/system.json
      - ASPNETCORE_ENVIRONMENT=Production
      # GC 默认已在 runtimeconfig 中启用 Server/Concurrent/RetainVM/CpuGroup（吞吐优先）。
      # 多环境可按容器内存限额按需覆盖（取消注释并调整）；DOTNET_* 环境变量优先于 runtimeconfig。
      # - DOTNET_GCHeapHardLimitPercent=75   # 容器内存受限时限制堆占比，防 OOM Kill
      # - DOTNET_gcServer=0                  # 小内存/低并发环境可退回 Workstation GC
      # - DOTNET_gcConcurrent=0              # 优先降低 CPU 占用而非停顿
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5300/health"]
      interval: 30s
      timeout: 5s
      retries: 3
